[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-state-tomography-mle"
version = "2.0.0"
description = "Maximum Likelihood Quantum State Tomography & Density Matrix Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=8", "httpx>=0.25", "fastapi>=0.100", "uvicorn>=0.23"]

[tool.setuptools.packages.find]
include = ["agents*", "quantum_tomography*"]

[project.scripts]
quantum-state-tomography-mle = "quantum_tomography.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-state-tomography-mle"
Repository = "https://github.com/abusuraihsakhri/quantum-state-tomography-mle.git"
